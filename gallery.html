<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RafaHatesRats — gallery</title>
    <style>
      html, body { margin: 0; background: #7b7e82; color: #111; font: 13px/1.3 system-ui, sans-serif; }
      #game canvas { display: block; }
      h2 { margin: 18px 12px 6px; font-size: 16px; }
      .frames { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 12px 24px; }
      .frame { position: relative; background: #8c8f93; outline: 1px solid #6c6f73; }
      .frame span { position: absolute; left: 3px; top: 2px; font-size: 11px; color: #000; }
      .pivot { position: absolute; width: 9px; height: 9px; margin: -5px 0 0 -5px; border: 1px solid #f0f; border-radius: 50%; }
      .hub { position: absolute; width: 5px; height: 5px; margin: -3px 0 0 -3px; background: #0ff; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="frames"></div>
    <script type="module" src="./src/gallery.ts"></script>
  </body>
</html>
